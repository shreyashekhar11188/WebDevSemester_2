<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function in JS</title>
</head>
<body>
    <script>
        //function:- block of code, used or defined to perform specific tasks
        //Types of functions
        // normal function :- with para, without para and with default 

        // normal function without parameters..

        function demo(){
            console.log("hello JS");
        }
        demo(); // function calling

        //with parameters

        function demo1(text){
            console.log("hello " + text);
        }
        demo1("React");
        //default parameters

        function add(a,b){
            console.log("Addition is " + (a+b));

        }
        add(123,23);
    </script>
    </body>
    </html>
